<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erro 404 — Página pausada</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#060b24;color:#fff;font-family:Barlow,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:#0b5fff;filter:blur(160px);opacity:.35;top:-160px;left:-160px}
body::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#ffcf00;filter:blur(160px);opacity:.14;bottom:-140px;right:-140px}
.wrap{position:relative;z-index:1;max-width:640px}
.logo{width:92px;height:92px;border-radius:50%;object-fit:cover;margin:0 auto 26px;display:block}
.code{font:900 clamp(110px,22vw,210px)/0.85 "Barlow Condensed",sans-serif;color:transparent;-webkit-text-stroke:3px #ffcf00;letter-spacing:.02em}
h1{font:900 clamp(38px,7vw,64px)/0.95 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:10px 0 14px}
h1 em{font-style:italic;color:#ffcf00}
p{color:#9fb3e8;font-size:16px;line-height:1.6;max-width:44ch;margin:0 auto}
.rule{width:64px;height:5px;background:#ffcf00;margin:26px auto 0}
</style>
</head>
<body>
<main class="wrap">
<img class="logo" src="logo.png" alt="Corpo Saúde Academia">
<p class="code">404</p>
<h1>A página foi <em>pausada.</em></h1>
<p>Entre em contato com o desenvolvedor.</p>
<div class="rule"></div>
</main>
</body>
</html>
